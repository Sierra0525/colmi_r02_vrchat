[project]
name = "colmi-r02-vrchat"
version = "0.1.0"
description = "Stream real-time heart rate from a Colmi R02 smart ring to a VRChat avatar via OSC"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "colmi_r02_client @ git+https://github.com/tahnok/colmi_r02_client.git",
    "python-osc>=1.8",
]

[project.scripts]
colmi-r02-vrchat = "colmi_r02_vrchat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colmi_r02_vrchat"]

[tool.hatch.metadata]
allow-direct-references = true
